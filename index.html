<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Harsh's Resource Portal</title>
  <style>
    :root {
      --yt-red: #ff0000;
      --cp-green: #28a745;
      --accent-blue: #007bff;
      --text-light: #ffffff;
      --overlay-dark: rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: url("https://i.ibb.co/XftK1trp/Wallpaper-2.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', sans-serif;
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .overlay {
      background-color: var(--overlay-dark);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 800px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
    }

    .section {
      margin-bottom: 35px;
    }

    .section h2 {
      margin-bottom: 15px;
      font-size: 1.5rem;
      border-bottom: 2px solid var(--text-light);
      padding-bottom: 5px;
    }

    .link-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .resource-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-light);
      transition: background 0.3s ease;
    }

    .resource-link:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .resource-link span {
      font-size: 1rem;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      .section h2 {
        font-size: 1.2rem;
      }
      .resource-link span {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Welcome to Harsh's Resource Hub</h1>

    <div class="section">
      <h2>Documents</h2>
      <div class="link-group">
        <a class="resource-link" href="https://cryptpad.fr/drive/#/2/drive/view/s31ROeWEVg0ObdZpc52omeKhefkuQVHre96k+QcRkOw/p/" target="_blank">
          <span>Harsh Docs</span>
        </a>
        <a class="resource-link" href="https://4gybdj-my.sharepoint.com/:f:/g/personal/nityanand_4gybdj_onmicrosoft_com/Eq97mcWpr3tNiEkYr9RKiFYBMXWBhuVyQl-r4E25LuKwcA?e=oAjs8t" target="_blank">
          <span>Other Documents</span>
        </a>
      </div>
    </div>

    <div class="section">
      <h2>Study</h2>
      <div class="link-group">
        <a class="resource-link" href="https://4gybdj-my.sharepoint.com/:f:/g/personal/nityanand_4gybdj_onmicrosoft_com/Enc-7P9QCNFOkBzEvBkZYVUBaVN5Yx20LzeXnRzhssyVNw?e=rxcnbL" target="_blank">
          <span>Books</span>
        </a>
        <a class="resource-link" href="https://4gybdj-my.sharepoint.com/:f:/g/personal/nityanand_4gybdj_onmicrosoft_com/EgFj6RsUb3ZHhZ6_8JaVtXYBQfxIY50dPn_35LcblAU_WA?e=jigzie" target="_blank">
          <span>Audiobooks</span>
        </a>
        <a class="resource-link" href="https://4gybdj-my.sharepoint.com/:f:/g/personal/nityanand_4gybdj_onmicrosoft_com/EtWcxwlw0-xPuwGUOJfE8BgBVmXZWv8308f0fzjMq0MLfw?e=35KgNk" target="_blank">
          <span>CEH Complete Course</span>
        </a>
      </div>
    </div>

    <div class="section">
      <h2>Entertainment</h2>
      <div class="link-group">
        <a class="resource-link" href="https://4gybdj-my.sharepoint.com/:f:/g/personal/nityanand_4gybdj_onmicrosoft_com/EoeCGV4DBRFGtMohsFNEwLsBXVM-qTpq87jS2691c_dPoQ?e=zTfTvj" target="_blank">
          <span>Ample</span>
        </a>
        <a class="resource-link" href="https://4gybdj-my.sharepoint.com/:f:/g/personal/nityanand_4gybdj_onmicrosoft_com/EtpynUiFHQdKhPpbt4AJdS0BqDws2nlO8A-3J2idtXckHg?e=PIn0UX" target="_blank">
          <span>Ample - 02</span>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
