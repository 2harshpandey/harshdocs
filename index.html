<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harsh Resources</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: url('https://i.ibb.co/XftK1trp/Wallpaper-2.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background-color: rgba(0, 0, 0, 0.75);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 600px;
      width: 90%;
      color: #fff;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      margin-bottom: 2rem;
      color: #ddd;
    }
    .section {
      margin-bottom: 2rem;
      padding: 1rem;
      border-radius: 1rem;
      background-color: rgba(255, 255, 255, 0.1);
    }
    .section h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: #fff;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .btn i {
      font-size: 1.2rem;
    }
    .btn:hover {
      opacity: 0.85;
      transform: scale(1.05);
    }
    .yt-btn { background-color: #FF0000; }
    .doc-btn { background-color: #28a745; }
    @media (max-width: 500px) {
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome</h1>
    <p class="subtitle">Select a resource to open:</p>

    <div class="section">
      <h2>YouTube Resources</h2>
      <div class="buttons">
        <a href="https://www.youtube.com/playlist?list=PLtqCjZrUdnGuwtBWOBNyUPkoPmDN_1Qst" class="btn yt-btn"><i class="fab fa-youtube"></i> Old Songs</a>
        <a href="https://www.youtube.com/playlist?list=PLtqCjZrUdnGuwtBWOBNyUPkoPmDN_1Qst&jct=h-rUyAonrIuAEJT9BfoNdg" class="btn yt-btn"><i class="fas fa-user-friends"></i> Old Songs Collab</a>
        <a href="https://www.youtube.com/playlist?list=PLtqCjZrUdnGvjatUB2UC0nJ3-hRmWW9e4&jct=4V55jyeBdcYK0WPOZ0mIvQ" class="btn yt-btn"><i class="fas fa-share-alt"></i> Me & Shirt Shared</a>
        <a href="https://www.youtube.com/playlist?list=PLtqCjZrUdnGuNVQ5d_352-pMUlqg-PDpX" class="btn yt-btn"><i class="fas fa-heart"></i> Self-Help</a>
        <a href="https://www.youtube.com/playlist?list=PLtqCjZrUdnGvui8_UYmrtAOk59-ZJuH1U" class="btn yt-btn"><i class="fas fa-laptop-code"></i> Computer Science</a>
      </div>
    </div>

    <div class="section">
      <h2>Secure Document</h2>
      <div class="buttons">
        <a href="https://cryptpad.fr/drive/#/2/drive/view/s31ROeWEVg0ObdZpc52omeKhefkuQVHre96k+QcRkOw/p/" class="btn doc-btn"><i class="fas fa-file-alt"></i> Go to Harsh Docs</a>
      </div>
    </div>
  </div>
</body>
</html>
