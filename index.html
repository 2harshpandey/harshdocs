<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure Resources</title>
  <style>
    :root {
      --yt-red: #ff0000;
      --cp-green: #28a745;
      --text-light: #ffffff;
      --overlay-dark: rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
      background: url("https://i.ibb.co/XftK1trp/Wallpaper-2.jpg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .overlay {
      background-color: var(--overlay-dark);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 90%;
      max-width: 500px;
      color: var(--text-light);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2rem;
    }

    p {
      margin-bottom: 25px;
      font-size: 1rem;
      color: #eee;
    }

    .group-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .group-box h2 {
      margin-bottom: 15px;
      color: #fff;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .button-group button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease-in-out;
      color: white;
    }

    .button-group button:hover {
      transform: scale(1.05);
    }

    .yt-btn {
      background-color: var(--yt-red);
    }

    .cp-btn {
      background-color: var(--cp-green);
    }

    svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    @media (min-width: 600px) {
      .button-group {
        flex-direction: row;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Welcome</h1>
    <p>Select a resource to open:</p>

    <!-- YouTube Resources -->
    <div class="group-box">
      <h2>YouTube Resources</h2>
      <div class="button-group">
        <button class="yt-btn" onclick="window.location.href='https://www.youtube.com/playlist?list=PLtqCjZrUdnGuwtBWOBNyUPkoPmDN_1Qst'">
          <svg viewBox="0 0 24 24"><path d="M10 15l5.2-3L10 9v6zm12-3c0-1.2-.2-2.3-.6-3.4-.4-1-1.3-1.9-2.3-2.3C17.3 6 12 6 12 6s-5.3 0-7.1.3c-1 .4-1.9 1.3-2.3 2.3C2.2 9.7 2 10.8 2 12s.2 2.3.6 3.4c.4 1 1.3 1.9 2.3 2.3 1.8.3 7.1.3 7.1.3s5.3 0 7.1-.3c1-.4 1.9-1.3 2.3-2.3.4-1.1.6-2.2.6-3.4z"/></svg>
          View Playlist
        </button>
        <button class="yt-btn" onclick="window.location.href='https://www.youtube.com/playlist?list=PLtqCjZrUdnGuwtBWOBNyUPkoPmDN_1Qst&jct=h-rUyAonrIuAEJT9BfoNdg'">
          <svg viewBox="0 0 24 24"><path d="M10 15l5.2-3L10 9v6zm12-3c0-1.2-.2-2.3-.6-3.4-.4-1-1.3-1.9-2.3-2.3C17.3 6 12 6 12 6s-5.3 0-7.1.3c-1 .4-1.9 1.3-2.3 2.3C2.2 9.7 2 10.8 2 12s.2 2.3.6 3.4c.4 1 1.3 1.9 2.3 2.3 1.8.3 7.1.3 7.1.3s5.3 0 7.1-.3c1-.4 1.9-1.3 2.3-2.3.4-1.1.6-2.2.6-3.4z"/></svg>
          Collaborator Link
        </button>
      </div>
    </div>

    <!-- CryptPad Button -->
    <div class="group-box">
      <h2>Secure Document</h2>
      <div class="button-group">
        <button class="cp-btn" onclick="window.location.href='https://cryptpad.fr/drive/#/2/drive/view/s31ROeWEVg0ObdZpc52omeKhefkuQVHre96k+QcRkOw/p/'">
          <svg viewBox="0 0 24 24"><path d="M10 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8l-8-6zM4 20V4h5v5h7v11H4z"/></svg>
          Go to Harsh Docs
        </button>
      </div>
    </div>
  </div>
</body>
</html>
